[workspace]
members = [".", "crates/wasmlet-cli", "crates/wasmlet-spec", "crates/wasmlet-bench"]
resolver = "2"
exclude = ["fixtures/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/archit2501/wasmlet"

[workspace.dependencies]
wasmlet = { path = "." }
log = "0.4.29"
wast = { version = "262.0.0", default-features = false, features = ["wasm-module"] }
wat = "1.262.0"
wasmparser = "0.262.0"
wasm-smith = "0.262.0"
arbitrary = "1.4.2"
wasmi = "2.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "wasmlet"
description = "A WebAssembly 2.0 (non-SIMD) interpreter written from scratch: decoder, validator, compact IR, runtime and a WASI preview1 subset."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true

[dev-dependencies]
wat.workspace = true

[lints]
workspace = true

[profile.release]
debug = 1
